name: Update site contact number

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-contact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update phone number and add contact links
        run: |
          python - <<'PY'
          from pathlib import Path

          old_display = '(574) 327-9874'
          old_tel = '+15743279874'
          old_plain = '5743279874'
          new_display = '(574) 213-8793'
          new_tel = '+15742138793'
          new_plain = '5742138793'

          contact = '''<div class="medicode-contact" style="text-align:center;padding:18px 20px;background:#f7fafb;border-top:1px solid #dce8eb;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Questions? Call or text MediCode Bootcamp: <a href="tel:+15742138793" style="font-weight:800;color:#0b6078;text-decoration:none;">(574) 213-8793</a> &nbsp;•&nbsp; <a href="sms:+15742138793" style="font-weight:800;color:#0b6078;text-decoration:none;">Send a Text</a></div>'''

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace(old_display, new_display).replace(old_tel, new_tel).replace(old_plain, new_plain)

              # Keep the archived old homepage private from new promotion, but remove any old personal number.
              if path.name != 'index-old.html' and new_tel not in text:
                  if '</footer>' in text:
                      text = text.replace('</footer>', contact + '\n</footer>', 1)
                  elif '</body>' in text:
                      text = text.replace('</body>', contact + '\n</body>', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print('Updated', path)
          PY
      - name: Commit updates
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Use MediCode Google Voice number across website"
          git push
